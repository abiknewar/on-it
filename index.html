<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>On It — what's trending</title>
  <meta name="description" content="A daily brief of what the world is searching for — the crazy, interesting, trending things. With a clean voice that reads the headlines to you." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🔥</span>
      <div>
        <h1>On It</h1>
        <p class="tagline" id="date-label">Loading what's trending…</p>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌗</button>
  </header>

  <!-- Narration bar -->
  <section class="narrator">
    <button id="narrate-btn" class="narrate-btn">
      <span class="narrate-icon">🔊</span>
      <span id="narrate-label">Narrate the headlines</span>
    </button>
    <button id="stop-btn" class="stop-btn" hidden>⏹ Stop</button>
    <p class="now-reading" id="now-reading" hidden></p>
  </section>

  <!-- Filters -->
  <nav class="filters" id="filters" aria-label="Filter">
    <button class="chip active" data-view="all">🔥 Trending</button>
    <button class="chip chip-saved" data-view="saved">📌 Saved</button>
  </nav>

  <main>
    <div id="banner" class="banner" hidden></div>
    <div id="feed" class="feed" aria-live="polite"></div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <footer class="foot">
    <p>On It · what the world is searching for, every day</p>
    <p class="foot-sub">Powered by Google Trends · voice by Edge Neural TTS · saved pins kept 7 days</p>
  </footer>

  <audio id="narration-audio" preload="none"></audio>
  <script src="assets/app.js"></script>
</body>
</html>
